<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estimador de páginas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/home.css" />
    <link rel="stylesheet" href="./css/menu.css" />
    <link rel="stylesheet" href="./css/dropzone.css" />
    <link rel="stylesheet" href="./css/settings.css" />
    <link rel="stylesheet" href="./css/textbox.css" />
    <link rel="stylesheet" href="./css/result.css" />

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Mammoth.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  </head>
  <body>
    <header id="menu"></header>

    <main>
      <div id="dropzone-slot"></div>

      <div class="workspace">
        <div id="settings-slot"></div>
        <div class="workspace-action">
          <button type="button" id="btn-estimate" class="btn btn-pill">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v4h12V4zm1 6v2h2v-2zm4 0v2h2v-2zm4 0v2h2v-2zM7 14v2h2v-2zm4 0v2h2v-2zm4 0v2h2v-2zM7 18v2h2v-2zm4 0v2h2v-2zm4 0v2h2v-2z"
              />
            </svg>
            Estimar páginas
          </button>
        </div>
        <div id="textbox-slot"></div>
      </div>

      <div id="result-slot"></div>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>

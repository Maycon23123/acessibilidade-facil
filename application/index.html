<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estimador de páginas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/home.css" />
    <link rel="stylesheet" href="./css/menu.css" />
    <link rel="stylesheet" href="./css/dropzone.css" />
    <link rel="stylesheet" href="./css/settings.css" />
    <link rel="stylesheet" href="./css/textbox.css" />
    <link rel="stylesheet" href="./css/result.css" />

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Mammoth.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  </head>
  <body>
    <header id="menu"></header>

    <main>
	  <!-- Dropzone -->
      <div id="dropzone-slot">
		<section id="dropzone" class="dropzone" aria-label="Enviar arquivo">
		  <div class="dropzone-title">
			<svg class="dropzone-icon" viewBox="0 0 24 24" aria-hidden="true">
			  <path
				d="M2 5.5A1.5 1.5 0 0 1 3.5 4h5.2c.4 0 .8.2 1.1.5L11 6h9.5A1.5 1.5 0 0 1 22 7.5v11a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 18.5z"
			  />
			</svg>
			<h2>Arraste seu arquivo</h2>
		  </div>
		  <p class="dropzone-or">Ou</p>
		  <button type="button" id="btn-select-file" class="btn btn-pill">
			Selecionar arquivo
		  </button>
		  <input type="file" id="file-input" accept=".txt,.md,.pdf,.docx" hidden />
		  <p id="file-name" class="dropzone-file" aria-live="polite"></p>
		</section>
	  </div>

      <div class="workspace">
		<!-- Settings -->
        <div id="settings-slot">
			<aside class="card settings-card">
			  <h2 class="card-title">
				<svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true">
				  <path
					d="M19.4 13a7.9 7.9 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.9 7.9 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.3.4.5.4h4c.2 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
				  />
				</svg>
				Configurações
			  </h2>

			  <form id="settings-form" class="settings-form" novalidate>
				<label class="field">
				  <span>Papel:</span>
				  <select id="paper" name="paper"></select>
				</label>

				<label class="field">
				  <span>Contração:</span>
				  <select id="contraction" name="contraction"></select>
				</label>

				<label class="field">
				  <span>Margem:</span>
				  <select id="margin" name="margin"></select>
				</label>

				<button type="submit" class="btn btn-block">Salvar configurações</button>
				<p id="settings-status" class="settings-status" aria-live="polite"></p>
			  </form>
			</aside>
		</div>
        <div class="workspace-action">
          <button type="button" id="btn-estimate" class="btn btn-pill">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v4h12V4zm1 6v2h2v-2zm4 0v2h2v-2zm4 0v2h2v-2zM7 14v2h2v-2zm4 0v2h2v-2zm4 0v2h2v-2zM7 18v2h2v-2zm4 0v2h2v-2zm4 0v2h2v-2z"
              />
            </svg>
            Estimar páginas
          </button>
        </div>
		<!-- TextBox -->
        <div id="textbox-slot">
			<section class="card textbox-card">
			  <h2 class="card-title card-title-center">Digite o texto aqui:</h2>
			  <textarea
				id="text-input"
				class="textarea"
				aria-label="Texto a ser estimado"
			  ></textarea>
			</section>
		</div>
      </div>

      <div id="result-slot">
		<section id="result" class="result" aria-live="polite">Estimativa: N pgs</section>
	  </div>
    </main>

    <script src="./models/settings.js"></script>
	<script src="./models/braille.js"></script>
	<script src="./js/settings.js"></script>
	<script src="./js/dropzone.js"></script>
	<script src="./js/main.js"></script>
  </body>
</html>

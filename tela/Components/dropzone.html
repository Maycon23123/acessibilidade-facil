<section id="dropzone" class="dropzone" aria-label="Enviar arquivo">
  <div class="dropzone-title">
    <svg class="dropzone-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M2 5.5A1.5 1.5 0 0 1 3.5 4h5.2c.4 0 .8.2 1.1.5L11 6h9.5A1.5 1.5 0 0 1 22 7.5v11a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 18.5z"
      />
    </svg>
    <h2>Arraste seu arquivo</h2>
  </div>
  <p class="dropzone-or">Ou</p>
  <button type="button" id="btn-select-file" class="btn btn-pill">
    Selecionar arquivo
  </button>
  <input type="file" id="file-input" accept=".txt,.md,text/plain" hidden />
  <p id="file-name" class="dropzone-file" aria-live="polite"></p>
</section>
